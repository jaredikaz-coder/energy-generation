name: Update power station data

# Built from a Geofabrik extract rather than Overpass: public Overpass
# instances rate-limit shared CI addresses so hard that runs spent twenty
# minutes in backoff and still came away empty. An extract has no limits and
# finishes in a few minutes. tools/fetch-power-data.mjs remains for ad-hoc
# Overpass fetches of other areas.
on:
  schedule:
    - cron: '17 3 * * 0'      # Sundays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: power-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Download the Great Britain extract
        run: |
          curl -L --fail --retry 3 --retry-delay 10 \
            -o gb.osm.pbf https://download.geofabrik.de/europe/great-britain-latest.osm.pbf
          ls -lh gb.osm.pbf

      - name: Filter to power features
        run: |
          osmium tags-filter -o power.osm.pbf gb.osm.pbf \
            nwr/power=plant nwr/power=generator w/power=line w/power=cable
          ls -lh power.osm.pbf
          osmium export power.osm.pbf -f geojsonseq --add-unique-id=type_id -o power.geojsonseq
          wc -l power.geojsonseq

      - name: Build the datasets
        run: node tools/build-from-extract.mjs power.geojsonseq

      - name: Commit any changes
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add data
          if git diff --staged --quiet; then
            echo "No change in the dataset."
          else
            git commit -m "Update power station and line data ($(date -u +%Y-%m-%d))"
            git push
          fi
