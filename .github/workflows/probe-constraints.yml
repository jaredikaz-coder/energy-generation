name: Probe constraint data sources

# Diagnostic only: reports which public GB constraint feeds are reachable,
# what they return, and whether a browser may call them directly. Writes
# nothing and commits nothing — read the run's log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/probe-constraint-sources.mjs
